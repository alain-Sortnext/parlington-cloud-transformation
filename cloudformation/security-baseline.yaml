AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Parlington Ltd — Security Baseline Stack
  Status: BROKEN — has a syntax error and a logical error
  Phase 4: Find and fix both issues, then deploy successfully

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod
    Default: dev

  AlertEmail:
    Type: String
    Description: Email address for security alerts
    # BUG: No AllowedPattern to validate email format

Resources:

  # CloudTrail — FCA audit trail requirement
  CloudTrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'parlington-cloudtrail-${Environment}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudTrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CloudTrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${CloudTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  ParlingtonCloudTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: CloudTrailBucketPolicy
    Properties:
      TrailName: !Sub 'parlington-${Environment}-trail'
      S3BucketName: !Ref CloudTrailBucket
      IsLogging: true
      EnableLogFileValidation: true
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      # SYNTAX ERROR: The following property name is wrong
      # CloudWatchLogsLogGroupArnRef should be CloudWatchLogsLogGroupArn
      CloudWatchLogsLogGroupArnRef: !GetAtt CloudTrailLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt CloudTrailRole.Arn

  CloudTrailLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/cloudtrail/parlington-${Environment}'
      RetentionInDays: 2557
      # NOTE: 2557 days = 7 years — FCA record retention requirement

  CloudTrailRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudTrailCloudWatchPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt CloudTrailLogGroup.Arn

  # GuardDuty — threat detection
  GuardDutyDetector:
    Type: AWS::GuardDuty::Detector
    Properties:
      Enable: true
      # LOGICAL ERROR: FindingPublishingFrequency set to SIX_HOURS
      # FCA security policy requires FIFTEEN_MINUTES for production
      FindingPublishingFrequency: SIX_HOURS

  # SNS Topic for security alerts
  SecurityAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'parlington-security-alerts-${Environment}'
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

Outputs:
  CloudTrailArn:
    Value: !GetAtt ParlingtonCloudTrail.Arn
    Description: CloudTrail ARN for audit purposes

  GuardDutyDetectorId:
    Value: !Ref GuardDutyDetector
    Description: GuardDuty Detector ID
